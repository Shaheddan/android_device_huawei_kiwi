disable_scan_offload=1
p2p_disabled=1
p2p_no_group_iface=1
tdls_external_control=1
interworking=1
hs20=1
auto_interworking=0
# kiwi's prima driver rejects every association when management frame protection is
# offered (Android 14's wpa_supplicant.conf template sets pmf=1). The overlay is read
# after /data/vendor/wifi/wpa/wpa_supplicant.conf, so this wins on every install.
pmf=0
